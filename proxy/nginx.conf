# The only way in to the web panel. Reached through the Cloudflare Tunnel on the
# host (HTTPS there), so nginx listens on plain HTTP and compose binds it to
# 127.0.0.1 only.

# The visitor's address: Cloudflare's header when the request came through the
# tunnel, the socket otherwise. Only the tunnel and the Pi itself reach this
# port, so the header cannot be forged from outside.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $client_ip zone=panel:5m rate=10r/s;
limit_conn_zone $client_ip zone=perip:5m;

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_conn perip 30;
    limit_req_status 429;
    limit_conn_status 429;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # The panel, resolved at request time so nginx starts even while it is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $web http://web:8080;

    location / {
        limit_req zone=panel burst=40 nodelay;
        proxy_pass $web;
        proxy_http_version 1.1;
        # With its port: the panel compares it with the browser's Origin.
        proxy_set_header Host $http_host;
        # Replaced, never appended: the address the panel's login lockout uses.
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 120s;
    }
}
