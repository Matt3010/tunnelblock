name: Phase 1 verification

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ADMIN_API_TOKEN: ci-placeholder
      TELEGRAM_BOT_TOKEN: ci-placeholder
      TELEGRAM_ALLOWED_USER_IDS: "1"
      GITHUB_TOKEN: ""
      HOST_REPO_DIR: .
      WG_SERVER_ENDPOINT: 203.0.113.10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Shell syntax
        run: |
          sh -n \
            vpn/wireguard/entrypoint.sh \
            vpn/wireguard/healthcheck.sh \
            vpn/wireguard/show-client.sh \
            scripts/wireguard-client.sh \
            ops/deploy.sh \
            updater/bootstrap-update.sh

      - name: Compose validation
        run: docker compose config --quiet

      - name: Build complete stack
        run: docker compose build

      - name: DNS tests
        run: docker compose run --rm --no-deps --entrypoint npm doh-a test

      - name: DNS typecheck
        run: docker compose run --rm --no-deps --entrypoint npm doh-a run typecheck

      - name: Telegram typecheck
        run: docker compose run --rm --no-deps --entrypoint npm telegram-bot run typecheck

      - name: Updater typecheck
        run: docker compose run --rm --no-deps --entrypoint npm updater run typecheck
