name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_API_TOKEN: ci-admin-token
      TELEGRAM_BOT_TOKEN: ci-telegram-token
      TELEGRAM_ALLOWED_USER_IDS: "1"
      GITHUB_TOKEN: ci-read-token
      WG_SERVER_ENDPOINT: 192.0.2.1
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose and shell
        run: |
          docker compose config --quiet
          docker compose --profile https-lab config --quiet
          sh -n ops/*.sh scripts/*.sh vpn/wireguard/*.sh
      - name: Build production stack
        run: docker compose build
      - name: Build HTTPS lab
        run: docker compose --profile https-lab build https-proxy
      - name: Test and typecheck
        run: |
          docker compose run --rm --no-deps --entrypoint npm doh-a test
          docker compose run --rm --no-deps --entrypoint npm doh-a run typecheck
          docker compose run --rm --no-deps --entrypoint npm updater test
          docker compose run --rm --no-deps --entrypoint npm updater run typecheck
          docker compose run --rm --no-deps --entrypoint npm telegram-bot run typecheck
          HTTPS_IMAGE="$(docker compose --profile https-lab images -q https-proxy)"
          test -n "$HTTPS_IMAGE"
          docker run --rm --entrypoint python "$HTTPS_IMAGE" -B -m unittest discover -s /tests -v
      - name: Verify HTTPS proxy is excluded by default
        run: test -z "$(docker compose config --services | grep '^https-proxy$' || true)"
