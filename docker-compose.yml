services:
  debug-collector:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DEBUG_TOKEN: ${DEBUG_TOKEN:-change-me}
    ports:
      - "8787:8787"

  doh:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /workspace/dns
    command:
      - /bin/sh
      - -lc
      - |
        npm install &&
        npm start
    environment:
      HOST: 0.0.0.0
      PORT: 8053
      UPSTREAM_DNS_HOST: 1.1.1.1
      UPSTREAM_DNS_PORT: 53
    volumes:
      - ./:/workspace:ro
    ports:
      - "8053:8053"
