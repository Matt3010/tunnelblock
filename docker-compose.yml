name: adblock-general-purpose

x-doh-common: &doh-common
  build:
    context: .
    dockerfile: dns/Dockerfile
  restart: unless-stopped
  environment:
    HOST: 0.0.0.0
    PORT: 8053
    UPSTREAM_DNS_HOST: 1.1.1.1
    UPSTREAM_DNS_PORT: 53
    PUBLIC_DOH_URL: https://adblock.scanferlamatteo.work/dns-query
    ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
  volumes:
    - ./data/rules:/rules
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:8053/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 5s
    timeout: 2s
    retries: 3
    start_period: 5s

services:
  debug-collector:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DEBUG_TOKEN: ${DEBUG_TOKEN:-change-me}
    ports:
      - "8787:8787"

  doh-a:
    <<: *doh-common

  doh-b:
    <<: *doh-common

  doh-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      doh-a:
        condition: service_healthy
      doh-b:
        condition: service_healthy
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8053:8053"

  updater:
    build:
      context: .
      dockerfile: updater/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8090
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GIT_BRANCH: master
      REPO_DIR: /workspace
      COMPOSE_PROJECT_NAME: adblock-general-purpose
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  telegram-bot:
    build:
      context: .
      dockerfile: telegram/Dockerfile
    restart: unless-stopped
    depends_on:
      doh-proxy:
        condition: service_started
      updater:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
      ADMIN_API_BASE: http://doh-proxy:8053
      UPDATER_API_BASE: http://updater:8090
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
