name: adblock-general-purpose

x-doh-common: &doh-common
  build:
    context: .
    dockerfile: dns/Dockerfile
  restart: unless-stopped
  environment:
    HOST: 0.0.0.0
    PORT: 8053
    UPSTREAM_DNS_HOST: 1.1.1.1
    UPSTREAM_DNS_PORT: 53
    PUBLIC_DOH_URL: https://adblock.scanferlamatteo.work/dns-query
    ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
    STATS_DB_PATH: /stats/stats.sqlite
  volumes:
    - ${HOST_REPO_DIR:-.}/data/rules:/rules
    - stats-data:/stats
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:8053/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 5s
    timeout: 2s
    retries: 3
    start_period: 5s

services:
  redis:
    # Transitional compatibility only: old updater revisions explicitly target
    # this service. It is not part of the normal stack and the new updater
    # removes its container/volume after self-replacement.
    profiles:
      - legacy-bootstrap
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s

  # Compatibility bridge for the updater runtime that predates reliable
  # self-replacement. The legacy updater already starts this service on deploy,
  # so it can hand control to the independent updater-replacer exactly once.
  debug-collector:
    image: adblock-general-purpose-legacy-bootstrap:latest
    build:
      context: .
      dockerfile: updater/Dockerfile
    restart: "no"
    environment:
      HOST_REPO_DIR: ${HOST_REPO_DIR:-.}
    volumes:
      - ${HOST_REPO_DIR:-.}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    command:
      - sh
      - -lc
      - |
        set -eu
        echo "Legacy updater bootstrap: starting real debug collector."
        docker compose build debug-api
        docker compose up -d --no-deps --force-recreate debug-api
        echo "Legacy updater bootstrap: handing updater replacement to watchdog."
        sleep 5
        docker compose up -d --no-deps --force-recreate updater-replacer

  debug-api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DEBUG_TOKEN: ${DEBUG_TOKEN:-change-me}
    ports:
      - "8787:8787"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s

  doh-a:
    <<: *doh-common

  doh-b:
    <<: *doh-common

  doh-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    restart: unless-stopped
    depends_on:
      doh-a:
        condition: service_healthy
      doh-b:
        condition: service_healthy
    ports:
      - "8053:8053"

  updater:
    image: adblock-general-purpose-updater:latest
    build:
      context: .
      dockerfile: updater/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8090
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GIT_BRANCH: master
      REPO_DIR: /workspace
      COMPOSE_PROJECT_NAME: adblock-general-purpose
      AUTO_UPDATE_INTERVAL_SEC: 300
      LIST_REFRESH_INTERVAL_HOURS: 24
      UPDATER_STATE_FILE: /updater-data/state.json
      LEGACY_REDIS_VOLUME: adblock-general-purpose-redis-data
      UPDATER_RUNTIME_GENERATION: "2"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
    volumes:
      - ${HOST_REPO_DIR:-.}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - updater-data:/updater-data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  updater-replacer:
    image: adblock-general-purpose-updater:latest
    restart: "on-failure:5"
    environment:
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      HOST_REPO_DIR: ${HOST_REPO_DIR:-.}
      EXPECTED_UPDATER_GENERATION: "2"
    volumes:
      - ${HOST_REPO_DIR:-.}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    command:
      - sh
      - -lc
      - |
        set -eu
        sleep 3
        echo "Recreating updater runtime..."
        docker compose up -d --no-deps --force-recreate updater
        for i in $(seq 1 45); do
          CID="$(docker compose ps -q updater 2>/dev/null || true)"
          if [ -n "$CID" ]; then
            STATE="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CID" 2>/dev/null || true)"
            if [ "$STATE" = "healthy" ]; then
              if curl -fsS                 -H "Authorization: Bearer $ADMIN_API_TOKEN"                 http://updater:8090/status                 | grep -Fq "\"runtimeGeneration\":\"$EXPECTED_UPDATER_GENERATION\""; then
                echo "Updater runtime generation $EXPECTED_UPDATER_GENERATION is healthy."
                exit 0
              fi
            fi
          fi
          sleep 1
        done
        echo "Updater replacement verification failed."
        docker compose ps --all updater || true
        docker compose logs --no-color --tail=120 updater || true
        exit 1

  telegram-bot:
    build:
      context: .
      dockerfile: telegram/Dockerfile
    restart: unless-stopped
    depends_on:
      doh-proxy:
        condition: service_started
      updater:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
      ADMIN_API_BASE: http://doh-proxy:8053
      UPDATER_API_BASE: http://updater:8090
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      TELEGRAM_CLEANUP_INTERVAL_HOURS: 12
      TELEGRAM_DATA_DIR: /telegram-data
      BOT_RUNTIME_GENERATION: "2"
    volumes:
      - telegram-data:/telegram-data

volumes:
  stats-data:
    name: adblock-general-purpose-stats-data
  redis-data:
    name: adblock-general-purpose-redis-data
  telegram-data:
    name: adblock-general-purpose-telegram-data
  updater-data:
    name: adblock-general-purpose-updater-data
