name: adblock-general-purpose

x-doh-common: &doh-common
  build:
    context: .
    dockerfile: dns/Dockerfile
  restart: unless-stopped
  environment:
    HOST: 0.0.0.0
    PORT: 8053
    DNS_HOST: 0.0.0.0
    DNS_PORT: 53
    UPSTREAM_DNS_HOST: 1.1.1.1
    UPSTREAM_DNS_PORT: 53
    UPSTREAM_DNS_FAMILY: auto
    UPSTREAM_DNS_TIMEOUT_MS: 3000
    DNS_RATE_LIMIT_QPS: 200
    DNS_RATE_LIMIT_BURST: 400
    DNS_CACHE_MAX_ENTRIES: 10000
    DNS_CACHE_MAX_TTL_SECONDS: 3600
    ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
    STATS_DB_PATH: /stats/stats.sqlite
  volumes:
    - ${HOST_REPO_DIR:-.}/data/rules:/rules
    - stats-data:/stats
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:8053/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 5s
    timeout: 2s
    retries: 3
    start_period: 5s

services:
  doh-a:
    <<: *doh-common
    networks:
      - default
      - vpn-dns

  doh-b:
    <<: *doh-common
    networks:
      - default
      - vpn-dns

  wireguard:
    build:
      context: .
      dockerfile: vpn/wireguard/Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    depends_on:
      doh-a:
        condition: service_healthy
      doh-b:
        condition: service_healthy
    environment:
      WG_SERVER_ENDPOINT: ${WG_SERVER_ENDPOINT:-auto}
      WG_SERVER_PORT: 51820
      WG_SERVER_IPV4_ADDRESS: 10.66.66.1/24
      WG_SERVER_IPV6_ADDRESS: fd42:66:66::1/64
      WG_IPV4_SUBNET: 10.66.66.0/24
      WG_IPV6_SUBNET: fd42:66:66::/64
      WG_ALLOWED_IPS: 0.0.0.0/0, 224.0.0.251/32, 239.255.255.250/32, ::/0
      WG_DNS_SERVERS: 10.66.66.1
      WG_DNS_UPSTREAMS: doh-a,doh-b
      WG_MTU: 1420
      WG_DISCOVERY_RELAY: "1"
    volumes:
      - ${HOST_REPO_DIR:-.}/data/wireguard:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      - vpn-egress
      - vpn-dns
    healthcheck:
      test:
        - CMD
        - /app/healthcheck.sh
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  discovery-relay-host:
    image: adblock-general-purpose-discovery-relay:latest
    build:
      context: .
      dockerfile: vpn/discovery-relay/Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      DISCOVERY_MODE: host
      DISCOVERY_LAN_IFACE: ${DISCOVERY_LAN_IFACE:-auto}
      DISCOVERY_RELAY_PORT: 39090
      DISCOVERY_RELAY_TOKEN: ${ADMIN_API_TOKEN}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=1m,mode=1777
    healthcheck:
      test:
        - CMD
        - test
        - -f
        - /tmp/discovery-relay.ready
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 5s

  discovery-relay-vpn:
    image: adblock-general-purpose-discovery-relay:latest
    build:
      context: .
      dockerfile: vpn/discovery-relay/Dockerfile
    restart: unless-stopped
    depends_on:
      wireguard:
        condition: service_healthy
      discovery-relay-host:
        condition: service_healthy
    network_mode: service:wireguard
    environment:
      DISCOVERY_MODE: vpn
      DISCOVERY_RELAY_PORT: 39090
      DISCOVERY_RELAY_TOKEN: ${ADMIN_API_TOKEN}
      DISCOVERY_WG_IFACE: wg0
      WG_IPV4_SUBNET: 10.66.66.0/24
      DISCOVERY_MDNS_CLIENT_TTL: 120
      DISCOVERY_SSDP_CLIENT_TTL: 15
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=1m,mode=1777
    healthcheck:
      test:
        - CMD
        - test
        - -f
        - /tmp/discovery-relay.ready
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 5s

  updater:
    image: adblock-general-purpose-updater:latest
    build:
      context: .
      dockerfile: updater/Dockerfile
      args:
        UPDATER_BUILD_SHA: ${DEPLOY_SHA:-dev}
    restart: unless-stopped
    environment:
      PORT: 8090
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GIT_BRANCH: master
      REPO_DIR: /workspace
      COMPOSE_PROJECT_NAME: adblock-general-purpose
      AUTO_UPDATE_INTERVAL_SEC: 300
      LIST_REFRESH_INTERVAL_HOURS: 24
      UPDATER_STATE_FILE: /updater-data/state.json
      UPDATER_LOG_FILE: /updater-data/deploy.log
      UPDATER_DATA_VOLUME: adblock-general-purpose-updater-data
      UPDATER_RUNTIME_GENERATION: "2"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
    volumes:
      - ${HOST_REPO_DIR:-.}:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - updater-data:/updater-data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  telegram-bot:
    build:
      context: .
      dockerfile: telegram/Dockerfile
    restart: unless-stopped
    depends_on:
      doh-a:
        condition: service_healthy
      updater:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
      ADMIN_API_BASE: http://doh-a:8053
      UPDATER_API_BASE: http://updater:8090
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      TELEGRAM_CLEANUP_INTERVAL_HOURS: 12
      TELEGRAM_DATA_DIR: /telegram-data
      BOT_RUNTIME_GENERATION: "2"
    volumes:
      - telegram-data:/telegram-data

networks:
  vpn-egress:
    enable_ipv6: true
  vpn-dns:
    internal: true

volumes:
  stats-data:
    name: adblock-general-purpose-stats-data
  telegram-data:
    name: adblock-general-purpose-telegram-data
  updater-data:
    name: adblock-general-purpose-updater-data
